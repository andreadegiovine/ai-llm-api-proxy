# nginx davanti a ai-llm-api-proxy, per esporlo su internet in HTTPS.
# Guida completa: docs/NGINX.md
#
# Sostituisci:
#   llm.example.com    -> il tuo dominio
#   192.168.1.12:8081  -> IP e porta del proxy (127.0.0.1:8081 se nginx è nello stesso container)
# Se il container non ha IPv6 (`nginx -t` dà "Address family not supported"), togli le righe `listen [::]`.
#
# Installazione:
#   cp deploy/nginx-llm-proxy.conf /etc/nginx/sites-available/llm-proxy
#   ln -s /etc/nginx/sites-available/llm-proxy /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream llm_proxy {
    server 192.168.1.12:8081;
    keepalive 16;
}

# Limite di richieste per IP (le API key sono comunque obbligatorie)
limit_req_zone $binary_remote_addr zone=llm_proxy:10m rate=60r/m;

# HTTP: solo rinnovo dei certificati Let's Encrypt e redirect a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name llm.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1 (Debian 13). Su Debian 12 usa invece: listen 443 ssl http2;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name llm.example.com;

    ssl_certificate     /etc/letsencrypt/live/llm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Conversazioni lunghe e immagini in base64 producono richieste grandi
    client_max_body_size 50m;

    # Si espone solo l'API OpenAI. Gli endpoint interni di llama.cpp (/props, /slots,
    # /metrics, /tokenize...) restano raggiungibili solo dalla LAN.
    location /v1/ {
        limit_req zone=llm_proxy burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://llm_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Indispensabile per lo streaming (SSE): ogni token va inoltrato subito
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # Generazioni lunghe e tool lenti: non chiudere la connessione dopo 60 s
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
